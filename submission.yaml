submission:
  title: "MissionGuard AI — Mission Readiness & Predictive Maintenance Copilot"

  problem_statement: >
    Military and aerospace operators cannot reliably determine if aircraft engines are mission-ready,
    relying on rigid calendar-based maintenance while critical HUMS sensor degradation data sits unanalyzed.
    This leads to mid-mission aborts, unexpected groundings, and excessive maintenance costs.

  solution_summary: >
    MissionGuard AI is an operational decision-support copilot powered by IBM Bob that ingests turbofan sensor telemetry
    and maintenance logs to predict Remaining Useful Life (RUL), assess upcoming mission-window buffer compatibility,
    generate evidence-based readiness decisions, and rank prioritized maintenance actions.

  key_features:
    - "Leakage-free RUL regression and 30-cycle early warning failure classification"
    - "Condition-based Mission Readiness scoring against upcoming mission windows"
    - "Explainable degradation reasoning connecting sensor telemetry to mission buffers"
    - "Knowledge-grounded maintenance prioritization ranking (P1 Critical, P2 Urgent, P3 Scheduled)"
    - "IBM Bob Copilot conversational decision support answering critical readiness queries"

  tech_stack:
    languages:
      - "Python"
      - "TypeScript"
      - "SQL"
    frameworks:
      - "FastAPI"
      - "React"
      - "scikit-learn"
      - "Tailwind CSS"
      - "Vite"
    ibm_technologies:
      - "IBM Bob"
      - "IBM Bob Decision Tools (MCP)"
    databases:
      - "SQLite"
      - "SQLAlchemy"
    other:
      - "Recharts"
      - "GitHub Actions"
      - "Pytest"

  what_we_are_most_proud_of: >
    The end-to-end decision chain from raw sensor telemetry to conversational copilot reasoning:
    MissionGuard does not just alert that an engine is degrading; it evaluates whether the engine can complete
    its specific upcoming mission, explains the physical telemetry drivers, and gives maintenance commanders
    a prioritized action plan via IBM Bob.

  known_limitations: >
    Built using NASA C-MAPSS simulated turbofan degradation data and public maintenance logbook excerpts.
    Aircraft-to-maintenance linkage is synthetic (explicitly flagged in code). This is an operational
    decision-support prototype and does not connect to real military flight controls or avionics.

